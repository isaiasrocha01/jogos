<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bloco Sentinela – defesa de torre</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1030;--ink:#f2ead3;--dim:#9aa0c4;--cy:#4fd1c5;--pu:#a77bff;--go:#ffc93c;--panel:#1a1f4a;--line:#363f8a;color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1030}}
:root[data-theme="dark"]{--bg:#0d1030}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;z-index:3;pointer-events:none}
#hud>div{display:flex;flex-direction:column;gap:6px}
#hud-right-actions{display:flex;flex-direction:row;gap:6px}
.pill{display:flex;align-items:center;gap:8px;background:rgba(13,16,48,.78);border:1px solid rgba(154,160,196,.3);border-radius:99px;padding:6px 14px;font-family:'Silkscreen',monospace;font-size:14px;min-width:70px}
#mid{align-items:center;text-align:center}
#mid .pill{font-size:15px;color:var(--go)}#mid small{font-size:12px;color:var(--dim);background:rgba(13,16,48,.7);border-radius:99px;padding:3px 12px}
#rt{align-items:flex-end;pointer-events:auto}
.sq{width:42px;height:42px;border-radius:12px;border:1.5px solid rgba(154,160,196,.4);background:rgba(13,16,48,.78);font-family:'Silkscreen',monospace;font-size:14px;padding:0}
#note{position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:3;font-family:'Silkscreen',monospace;font-size:clamp(16px,4vw,26px);color:var(--ink);text-shadow:0 3px 0 #000;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;white-space:nowrap}
#note.on{opacity:1}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:4;background:linear-gradient(180deg,rgba(13,16,48,.92),#0b0d26);border-top:1px solid rgba(154,160,196,.25);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-height:46vh}
#pw{display:flex;gap:8px;justify-content:center}
.pw{position:relative;width:54px;height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);font-size:22px;padding:0;overflow:hidden}
.pw::after{content:'';position:absolute;inset:0;background:conic-gradient(rgba(5,7,25,.75) calc(var(--p,0)*1%),transparent 0);pointer-events:none}
.pw small{position:absolute;right:5px;bottom:2px;font-size:10px;color:var(--dim);z-index:1}
.pw.on{border-color:var(--cy);box-shadow:0 0 0 2px rgba(79,209,197,.3)}
#tabs{display:flex;gap:6px}
#tabs button{flex:1;padding:9px 4px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:12px;color:var(--dim)}
#tabs button.on{background:var(--cy);color:#05343a;border-color:var(--cy)}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;overflow:auto}
.card{display:grid;grid-template-columns:auto 1fr;grid-template-areas:'i n' 'i v' 'c c';align-items:center;gap:2px 8px;text-align:left;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel)}
.card:active{transform:scale(.97)}
.ci{grid-area:i;font-size:22px}.cn{grid-area:n;font-size:11px;color:var(--dim)}.cv{grid-area:v;font-family:'Silkscreen',monospace;font-size:14px}
.cc{grid-area:c;margin-top:4px;text-align:center;font-weight:800;font-size:13px;border-radius:8px;padding:5px;background:var(--go);color:#3a2a00}
.card.g .cc{background:var(--pu);color:#1a0a3a}.card.no .cc{background:#3b4070;color:#9aa0c4}
#ov{position:fixed;inset:0;z-index:20;background:rgba(8,10,30,.88);display:flex;padding:20px}
#ov.hide{display:none}
.box{margin:auto;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;text-align:center;background:rgba(35,40,80,.7);border:1px solid rgba(154,160,196,.25);border-radius:18px;padding:22px}
.box h2{margin:0;font-family:'Silkscreen',monospace;font-size:22px;color:var(--cy)}.box p{margin:0;color:var(--dim);font-size:14px;line-height:1.5}
.btn{padding:13px;border-radius:12px;border:1.5px solid var(--cy);background:transparent;font-weight:700}
.btn.main{background:var(--cy);color:#05343a}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">💎 <span id="gems">0</span></div></div>
  <div id="mid"><div class="pill" id="wv">Onda 1</div><small id="wsub"></small></div>
  <div id="rt">
    <div id="hud-right-actions">
      <button class="sq" id="bWall" aria-label="Construir Muralha (E ou Espaço)" title="Construir Muralha (E / Espaço)">🧱</button>
      <button class="sq" id="bSet" aria-label="Menu">⚙</button>
      <button class="sq" id="bSpd" aria-label="Velocidade">x1</button>
    </div>
  </div>
</div>
<div id="note" role="status"></div>
<div id="panel">
  <div id="pw"></div>
  <div id="tabs"><button data-t="0">⚔ ATAQUE</button><button data-t="1">🛡 DEFESA</button><button data-t="2">💎 ARCANO</button><button data-t="3">🧙 HERÓI</button><button data-t="4">👥 ALIADOS</button></div>
  <div id="cards"></div>
</div>
<div id="ov" class="hide"></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':String(Math.floor(n));
/* ---------- melhorias ---------- */
const UP=[
 {id:'dmg',tab:0,n:'Dano',ico:'💥',cost:l=>Math.round(10*1.33**l),val:l=>5*1.14**l,fmt:v=>v.toFixed(1)},
 {id:'aspd',tab:0,n:'Velocidade de ataque',ico:'⏱',cost:l=>Math.round(14*1.38**l),val:l=>1+.07*l,fmt:v=>v.toFixed(2)+'/s',max:60},
 {id:'cc',tab:0,n:'Chance de crítico',ico:'🎯',cost:l=>Math.round(20*1.4**l),val:l=>Math.min(.8,.015*l),fmt:v=>(v*100).toFixed(1)+'%',max:53},
 {id:'cf',tab:0,n:'Fator de crítico',ico:'✴',cost:l=>Math.round(25*1.36**l),val:l=>1.5+.1*l,fmt:v=>'x'+v.toFixed(2)},
 {id:'rng',tab:0,n:'Alcance',ico:'◎',cost:l=>Math.round(30*1.3**l),val:l=>170+2.5*l,fmt:v=>Math.round(v)+'',max:60},
 {id:'hp',tab:1,n:'Vida da torre',ico:'❤',cost:l=>Math.round(12*1.32**l),val:l=>100*1.12**l,fmt:v=>fmt(v)},
 {id:'reg',tab:1,n:'Regeneração',ico:'✚',cost:l=>Math.round(18*1.34**l),val:l=>.4*l,fmt:v=>v.toFixed(1)+'/s'},
 {id:'arm',tab:1,n:'Armadura',ico:'⛨',cost:l=>Math.round(22*1.38**l),val:l=>Math.min(.6,.02*l),fmt:v=>(v*100).toFixed(0)+'%',max:30},
 {id:'multi',tab:2,gem:1,n:'Tiros extras',ico:'✦',cost:l=>[3,8,20,45][l],val:l=>1+l,fmt:v=>v+' tiros',max:4},
 {id:'gold',tab:2,gem:1,n:'Bônus de ouro',ico:'🪙',cost:l=>2+2*l,val:l=>1+.15*l,fmt:v=>'x'+v.toFixed(2),max:20},
 {id:'pwr',tab:2,gem:1,n:'Poder dos itens',ico:'✧',cost:l=>3+3*l,val:l=>1+.2*l,fmt:v=>'x'+v.toFixed(1),max:15},
 {id:'hdmg',tab:3,n:'Dano do herói',ico:'🗡',cost:l=>Math.round(12*1.33**l),val:l=>3*1.14**l,fmt:v=>v.toFixed(1)},
 {id:'hatk',tab:3,n:'Ataque do herói',ico:'⏱',cost:l=>Math.round(16*1.37**l),val:l=>1.2+.06*l,fmt:v=>v.toFixed(2)+'/s',max:50},
 {id:'hhp',tab:3,n:'Vida do herói',ico:'♥',cost:l=>Math.round(12*1.32**l),val:l=>60*1.13**l,fmt:v=>fmt(v)},
 {id:'hspd',tab:3,n:'Velocidade do herói',ico:'👟',cost:l=>Math.round(20*1.35**l),val:l=>130+3*l,fmt:v=>Math.round(v)+'',max:40},
 {id:'hrng',tab:3,n:'Alcance do herói',ico:'◎',cost:l=>Math.round(24*1.32**l),val:l=>110+2*l,fmt:v=>Math.round(v)+'',max:40},
 {id:'hwall',tab:3,n:'Muralha do Herói',ico:'🧱',cost:l=>Math.round(20*1.34**l),val:l=>({lv:l,hp:Math.round(90*1.28**l),placeCost:l,thorns:l>=2?Math.round(l*2):0}),fmt:v=>v.lv===0?'Bloqueado':`nv ${v.lv} (${v.hp} HP · 🪙${v.placeCost})`,max:30},
 {id:'h_arch',tab:4,n:'Arqueira Elfa',ico:'🏹',cost:l=>Math.round(35*1.42**l),val:l=>l===0?0:(2.5*1.14**l),fmt:v=>v===0?'Bloqueado':v.toFixed(1)+' dano',max:30},
 {id:'h_mage',tab:4,n:'Mago de Gelo',ico:'❄',cost:l=>Math.round(60*1.45**l),val:l=>l===0?0:(3.2*1.14**l),fmt:v=>v===0?'Bloqueado':v.toFixed(1)+' dano',max:30},
 {id:'h_pala',tab:4,n:'Paladino Guardião',ico:'🛡',cost:l=>Math.round(90*1.48**l),val:l=>l===0?0:(4.0*1.15**l),fmt:v=>v===0?'Bloqueado':v.toFixed(1)+' dano',max:30}
];
const UM=Object.fromEntries(UP.map(u=>[u.id,u]));
const S0=()=>({coins:0,gems:0,wave:1,best:1,lv:Object.fromEntries(UP.map(u=>[u.id,0])),auto:true,speed:1,last:Date.now()});
let S=S0();
try{const r=JSON.parse(localStorage.getItem('bloco_sentinela')||'null');if(r){S=Object.assign(S0(),r);S.lv=Object.assign(S0().lv,r.lv)}}catch(e){}
const save=()=>{S.last=Date.now();try{localStorage.setItem('bloco_sentinela',JSON.stringify(S))}catch(e){}};
const val=id=>UM[id].val(S.lv[id]);
/* ---------- estado ---------- */
const PW=[{n:'Bomba',ico:'💣',cd:12},{n:'Agilidade',ico:'⚡',cd:25},{n:'Escudo',ico:'🛡',cd:30},{n:'Bichinho',ico:'🥚',cd:35}];
let W=0,H=0,dpr=1,cx=0,cy=0,K=1,t=0,shake=0,paused=false,tab=0;
let tw={hp:100,sh:0,shT:0,cd:0},hero={x:0,y:60,hp:60,cd:0,dead:false,rt:0,fx:1,fy:0,wallCd:0},walls=[],allies=[],pick=[],keys={},joy=null,mouseWorld={x:0,y:0,on:false},bnd={x:300,y0:-200,y1:200},en=[],bl=[],fx=[],tx=[],pets=[],agil=0,pcd=[0,0,0,0];
let phase='break',breakT=1.5,spawnQ=0,spawnT=0,bossWave=false;
const maxHp=()=>val('hp');
const deco=Array.from({length:46},(_,i)=>({x:(Math.sin(i*91.7)*.5+.5)*1600-800,y:(Math.cos(i*57.3)*.5+.5)*1200-600,s:6+(i*7)%10}));
let AC;function beep(f,d=.06,ty='square',v=.02,f2){try{AC=AC||new AudioContext();const o=AC.createOscillator(),k=AC.createGain(),n=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);k.gain.setValueAtTime(v,n);k.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(k).connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
let noteT=0;function note(m){const el=$('note');el.textContent=m;el.classList.add('on');clearTimeout(noteT);noteT=setTimeout(()=>el.classList.remove('on'),2200)}
/* ---------- ondas ---------- */
function startWave(){spawnQ=6+Math.floor(S.wave*1.5);spawnT=.4;phase='fight';bossWave=S.wave%5===0;note('Onda '+S.wave+(bossWave?' · CHEFE!':''))}
function spawn(){
  const w=S.wave,boss=bossWave&&spawnQ===1;let ty='n';
  if(boss)ty='b';else{const r=Math.random();if(w>=4&&r<.2)ty='t';else if(w>=2&&r<.45)ty='f'}
  const D={n:{hp:1,sp:46,sz:20,d:1,c:'#ff8a5c',rw:1},f:{hp:.55,sp:80,sz:15,d:.7,c:'#ffe14d',rw:1.2},t:{hp:2.8,sp:30,sz:30,d:1.6,c:'#ff5d73',rw:2.5},b:{hp:20,sp:26,sz:52,d:4,c:'#c04dff',rw:12}}[ty];
  const a=Math.random()*Math.PI*2,R=Math.hypot(W,H)/2/K+50,hp=7*1.17**w*D.hp;
  en.push({x:Math.cos(a)*R,y:Math.sin(a)*R,hp,mhp:hp,sp:D.sp*(1+w*.005),sz:D.sz,d:D.d,c:D.c,rw:D.rw,ty,fl:0});
}
function waveClear(){
  const w=S.wave;S.coins+=Math.ceil(w*3*val('gold'));S.wave++;S.best=Math.max(S.best,S.wave);
  phase='break';breakT=2.5;note('Onda '+w+' concluída!');beep(620,.12,'triangle',.04,930);save();
}
function fall(){hero.hp=val('hhp');hero.dead=false;hero.x=0;hero.y=60;tw.hp=maxHp();tw.sh=0;for(const al of allies){al.hp=al.mhp;al.dead=false}en=[];bl=[];spawnQ=0;phase='break';breakT=3;note('A torre caiu! Repetindo a onda');beep(160,.4,'sawtooth',.05,50)}
function hurtTower(d){
  if(tw.sh>0){const a=Math.min(tw.sh,d);tw.sh-=a;d-=a}
  if(d>0){tw.hp-=d;shake=Math.min(6,shake+.4)}
  if(tw.hp<=0)fall();
}
function burst(x,y,c,n=8){for(let i=0;i<n;i++)fx.push({k:'p',x,y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,l:.5,c})}
function hit(e,d,crit){
  e.hp-=d;e.fl=.1;tx.push({x:e.x,y:e.y-e.sz/2,v:Math.round(d),c:crit?'#ffe14d':'#fff',l:.8,b:crit});
  if(e.hp>0)return;
  const i=en.indexOf(e);if(i<0)return;en.splice(i,1);
  S.coins+=Math.ceil(e.rw*(1+S.wave*.35)*val('gold'));
  if(e.ty==='b'){for(let i=0;i<3+Math.floor(S.wave/5);i++)pick.push({x:e.x+(Math.random()-.5)*50,y:e.y+(Math.random()-.5)*50,t:14});note('Chefe derrotado! Pegue as 💎 com o herói')}else if(Math.random()<.02)pick.push({x:e.x,y:e.y,t:14});
  burst(e.x,e.y,e.c,e.ty==='b'?24:8);beep(300+Math.random()*200,.04,'square',.015);
}
function fire(tg,mult,ox=0,oy=-28,base=val('dmg'),h=0,c=null){
  const crit=Math.random()<val('cc');
  bl.push({x:ox,y:oy,tg,d:base*mult*(crit?val('cf'):1),crit,h,c});
}
/* ---------- herói, muralhas & aliados ---------- */
function buildHeroWall(targetX=null, targetY=null){
  if(hero.dead || paused) return false;
  const cfg = val('hwall');
  if(!cfg || cfg.lv <= 0){
    note('Desbloqueie a Muralha na aba HERÓI!');
    beep(130, .1, 'sawtooth', .03);
    return false;
  }
  const cost = cfg.placeCost || cfg.lv || 1;
  if(S.coins < cost){
    note(`🪙 Moedas insuficientes! Precisa de ${cost}`);
    beep(140, .08, 'sawtooth', .03);
    return false;
  }
  if(hero.wallCd > 0){
    return false;
  }
  let wx, wy;
  if(targetX != null && targetY != null){
    wx = Math.round(targetX);
    wy = Math.round(targetY);
    // Limita para a área de jogo visível
    wx = Math.max(-bnd.x + 15, Math.min(bnd.x - 15, wx));
    wy = Math.max(bnd.y0 + 15, Math.min(bnd.y1 - 15, wy));
    // Não deixa colar dentro do núcleo da torre
    const dt = Math.hypot(wx, wy);
    if(dt < 44){
      wx = Math.round(wx / (dt || 1) * 44);
      wy = Math.round(wy / (dt || 1) * 44);
    }
  } else {
    wx = Math.round(hero.x + hero.fx * 24);
    wy = Math.round(hero.y + hero.fy * 24);
  }
  // Evita sobreposição quase idêntica com outra muralha existente
  for(const existing of walls){
    if(Math.hypot(existing.x - wx, existing.y - wy) < 14){
      return false;
    }
  }
  S.coins -= cost;
  walls.push({
    x: wx, y: wy,
    hp: cfg.hp, mhp: cfg.hp,
    lv: cfg.lv,
    sz: 28,
    thorns: cfg.thorns || 0,
    fl: 0
  });
  hero.wallCd = 0.15;
  burst(wx, wy, '#8a9ab8', 10);
  tx.push({x: wx, y: wy - 18, v: `-${cost}🪙`, c: '#ffc93c', l: 0.7, b: false});
  beep(360, .08, 'square', .04, 520);
  refresh();
  return true;
}
function wallsStep(dt){
  hero.wallCd = Math.max(0, hero.wallCd - dt);
  for(let i = walls.length - 1; i >= 0; i--){
    const w = walls[i];
    w.fl = Math.max(0, w.fl - dt);
    if(w.hp <= 0){
      burst(w.x, w.y, '#6a789a', 14);
      beep(150, .25, 'sawtooth', .04, 60);
      walls.splice(i, 1);
    }
  }
}
function drawWalls(){
  for(const w of walls){
    const x = w.x, y = w.y, s = w.sz, h = s / 2;
    // Sombra
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(x - h - 2, y + h - 2, s + 4, 6);
    // Base da muralha com tijolos de pedra
    ctx.fillStyle = w.fl > 0 ? '#fff' : '#2d3753';
    ctx.fillRect(x - h, y - h, s, s);
    ctx.fillStyle = w.fl > 0 ? '#fff' : (w.lv >= 10 ? '#384878' : '#414c70');
    ctx.fillRect(x - h + 2, y - h + 2, s - 4, s - 4);

    // Detalhe de ameias e reforço metálico se for nível alto
    ctx.fillStyle = w.lv >= 5 ? '#ffd43b' : '#6a78a0';
    ctx.fillRect(x - h + 3, y - h + 3, 5, 5);
    ctx.fillRect(x + h - 8, y - h + 3, 5, 5);
    ctx.fillRect(x - 2, y - 2, 4, 4);

    // Espinhos decorativos para nível de espinhos
    if(w.thorns > 0){
      ctx.fillStyle = '#ff6b6b';
      ctx.fillRect(x - h - 3, y - 3, 3, 6);
      ctx.fillRect(x + h, y - 3, 3, 6);
    }

    // Nível da muralha desenhado em cima
    ctx.fillStyle = '#f2ead3';
    ctx.font = '700 8px Silkscreen, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('v' + w.lv, x, y + 1);

    // Barra de vida da muralha
    const r = Math.max(0, w.hp / w.mhp);
    ctx.fillStyle = 'rgba(10,12,30,.85)';
    ctx.fillRect(x - h, y - h - 8, s, 4);
    ctx.fillStyle = r > 0.5 ? '#7be26b' : r > 0.25 ? '#ffc93c' : '#ff5d73';
    ctx.fillRect(x - h + 1, y - h - 7, (s - 2) * r, 2);
  }
}
const ALLY_DEFS = {
  h_arch: { n: 'Arqueira', col: '#51cf66', dark: '#2b8a3e', hat: '#37b24d', sp: 110, rng: 160, atkCd: 0.65, hpM: 0.8 },
  h_mage: { n: 'Mago', col: '#4dabf7', dark: '#1971c2', hat: '#339af0', sp: 85, rng: 140, atkCd: 1.1, hpM: 0.7, slow: true },
  h_pala: { n: 'Paladino', col: '#ffd43b', dark: '#f59f00', hat: '#fab005', sp: 95, rng: 80, atkCd: 0.75, hpM: 1.6 }
};
function syncAllies(){
  const types = ['h_arch', 'h_mage', 'h_pala'];
  for(let i=0; i<types.length; i++){
    const k = types[i], lv = S.lv[k] || 0;
    let al = allies.find(a => a.id === k);
    if(lv > 0){
      const def = ALLY_DEFS[k];
      const mhp = Math.round(val('hhp') * def.hpM);
      if(!al){
        const angle = (i * 2 + 1) * Math.PI / 3;
        allies.push({
          id: k, ...def,
          x: Math.cos(angle)*70, y: Math.sin(angle)*60 + 30,
          hp: mhp, mhp: mhp, cd: 0, dead: false, rt: 0, fx: 1, fy: 0,
          patrolAngle: angle
        });
      } else {
        al.mhp = mhp;
        if(al.hp > mhp) al.hp = mhp;
      }
    }
  }
}
function alliesStep(dt){
  syncAllies();
  for(const al of allies){
    if(al.dead){
      al.rt -= dt;
      if(al.rt <= 0){
        al.dead = false;
        al.hp = al.mhp;
        al.x = Math.cos(al.patrolAngle)*60;
        al.y = Math.sin(al.patrolAngle)*50 + 20;
        note(`${al.n} voltou à batalha!`);
      }
      continue;
    }
    // Cura passiva
    al.hp = Math.min(al.mhp, al.hp + al.mhp * 0.02 * dt);
    al.cd -= dt;

    // Movimentação tática: segue ao redor da torre / herói ou se posiciona para atacar
    al.patrolAngle += dt * 0.5;
    const anchorX = hero.dead ? 0 : hero.x * 0.35;
    const anchorY = hero.dead ? 0 : hero.y * 0.35;
    const destX = anchorX + Math.cos(al.patrolAngle) * (al.id === 'h_pala' ? 55 : 85);
    const destY = anchorY + Math.sin(al.patrolAngle) * (al.id === 'h_pala' ? 45 : 70);

    const dx = destX - al.x, dy = destY - al.y, dist = Math.hypot(dx, dy);
    if(dist > 5){
      al.x += (dx / dist) * al.sp * dt;
      al.y += (dy / dist) * al.sp * dt;
      al.fx = Math.sign(dx) || al.fx;
      al.fy = Math.sign(dy) || al.fy;
    }

    // Ataque
    if(al.cd <= 0 && en.length){
      const dmg = val(al.id);
      if(dmg > 0){
        let tg = null, bd = 1e9;
        for(const e of en){
          const d = Math.hypot(e.x - al.x, e.y - al.y) - e.sz/2;
          if(d <= al.rng && d < bd){ bd = d; tg = e; }
        }
        if(tg){
          fire(tg, 1, al.x, al.y - 6, dmg, 2, al.col);
          al.cd = al.atkCd;
          al.fx = Math.sign(tg.x - al.x) || al.fx;
          al.fy = Math.sign(tg.y - al.y) || al.fy;
          if(al.slow && tg.sp > 15) tg.sp *= 0.82; // Congela / lentidão suave do Mago de Gelo
        }
      }
    }
  }
}

function allyDie(al){

function heroDie(){hero.dead=true;hero.rt=6;burst(hero.x,hero.y,'#ffb03b',16);beep(200,.3,'sawtooth',.05,60);note('O herói caiu! Volta em 6s')}
function heroStep(dt){
  const mh=val('hhp');
  if(hero.dead){hero.rt-=dt;if(hero.rt<=0){hero.dead=false;hero.hp=mh;hero.x=0;hero.y=60;note('Herói de volta!')}return}
  let ix=(keys.r?1:0)-(keys.l?1:0),iy=(keys.d?1:0)-(keys.u?1:0);
  if(joy&&(joy.dx||joy.dy)){ix=joy.dx;iy=joy.dy}
  const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}
  const sp=val('hspd');hero.x+=ix*sp*dt;hero.y+=iy*sp*dt;
  if(m>.1){hero.fx=ix;hero.fy=iy}
  const dT=Math.hypot(hero.x,hero.y);if(dT<46){hero.x=hero.x/(dT||1)*46;hero.y=hero.y/(dT||1)*46}
  hero.x=Math.max(-bnd.x,Math.min(bnd.x,hero.x));hero.y=Math.max(bnd.y0,Math.min(bnd.y1,hero.y));
  hero.hp=Math.min(mh,hero.hp+mh*.02*dt);hero.cd-=dt;
  if(hero.cd<=0&&en.length){
    const r=val('hrng');let tg=null,bd=1e9;
    for(const e of en){const d=Math.hypot(e.x-hero.x,e.y-hero.y)-e.sz/2;if(d<=r&&d<bd){bd=d;tg=e}}
    if(tg){fire(tg,1,hero.x,hero.y-6,val('hdmg'),1);hero.cd=1/val('hatk')}
  }
}
function pickStep(dt){
  for(let i=pick.length-1;i>=0;i--){const q=pick[i];q.t-=dt;
    if(!hero.dead&&Math.hypot(q.x-hero.x,q.y-hero.y)<26){S.gems+=2;pick.splice(i,1);beep(1000,.08,'triangle',.04,1500)}

}
/* ---------- poderes ---------- */
function bombSpot(){let best=null;for(const e of en){let n=0;for(const o of en)if(Math.hypot(o.x-e.x,o.y-e.y)<100)n++;if(!best||n>best.n)best={x:e.x,y:e.y,n}}return best}
function cast(i){
  if(pcd[i]>0||paused)return false;const p=1+(val('pwr')-1);
  if(i===0){const b=bombSpot();if(!b)return false;
    for(const e of en.slice())if(Math.hypot(e.x-b.x,e.y-b.y)<110)hit(e,val('dmg')*10*p,true);
    fx.push({k:'r',x:b.x,y:b.y,r:10,m:110,c:'#ff8a5c',l:.4});shake=5;beep(110,.35,'sawtooth',.05,30)}
  else if(i===1){agil=8*p;beep(500,.2,'square',.04,1000)}
  else if(i===2){tw.sh=maxHp()*.6*p;tw.shT=12;beep(400,.2,'triangle',.04,800)}

function autoCast(){

/* ---------- atualização ---------- */
function update(dt){
  t+=dt;shake=Math.max(0,shake-dt*10);
  if(phase==='fight'){
    if(spawnQ>0){spawnT-=dt;if(spawnT<=0){spawn();spawnQ--;spawnT=Math.max(.3,1.1-S.wave*.02)}}
    else if(!en.length)waveClear();
  }else{breakT-=dt;if(breakT<=0)startWave()}
  tw.hp=Math.min(maxHp(),tw.hp+val('reg')*dt);
  if(tw.shT>0){tw.shT-=dt;if(tw.shT<=0)tw.sh=0}
  agil=Math.max(0,agil-dt);for(let i=0;i<4;i++)pcd[i]=Math.max(0,pcd[i]-dt);
  const rng=val('rng');tw.cd-=dt;
  if(tw.cd<=0&&en.length){
    const tg=en.filter(e=>Math.hypot(e.x,e.y)-e.sz/2<=rng).sort((a,b)=>Math.hypot(a.x,a.y)-Math.hypot(b.x,b.y));
    if(tg.length){for(let i=0;i<val('multi');i++)fire(tg[i%tg.length],1);tw.cd=1/(val('aspd')*(agil>0?2:1))}
  }
  for(const p of pets){p.a+=dt*1.8;p.t-=dt;p.cd-=dt;
    if(p.cd<=0&&en.length){const px=Math.cos(p.a)*72,py=Math.sin(p.a)*40-8,tg=en.filter(e=>Math.hypot(e.x,e.y)-e.sz/2<=rng*1.15).sort((a,b)=>Math.hypot(a.x-px,a.y-py)-Math.hypot(b.x-px,b.y-py))[0];
      if(tg){fire(tg,.7,px,py);p.cd=.8}}}
  pets=pets.filter(p=>p.t>0);
  heroStep(dt);alliesStep(dt);wallsStep(dt);pickStep(dt);
  for(const e of en){
    e.fl=Math.max(0,e.fl-dt);const d=Math.hypot(e.x,e.y),stop=34+e.sz/2;
    const hx=hero.x-e.x,hy=hero.y-e.y,dh=Math.hypot(hx,hy)||1;
    // Checa se há muralha no caminho bloqueando o monstro
    let blockerWall = null;
    for(const w of walls){
      const dw = Math.hypot(w.x - e.x, w.y - e.y);
      if(dw < e.sz/2 + w.sz/2){
        blockerWall = w;
        break;
      }
    }
    if(blockerWall){
      // Monstro ataca a muralha
      const dmg = e.d * 2.0 * 1.12**S.wave * dt;
      blockerWall.hp -= dmg;
      blockerWall.fl = 0.08;
      // Dano de espinhos da muralha
      if(blockerWall.thorns > 0){
        e.hp -= blockerWall.thorns * dt * 5;
        e.fl = 0.05;
        if(e.hp <= 0) hit(e, 1, false);
      }
      continue;
    }

    // Checa herói principal ou aliados próximos para perseguir/atacar
    let targetEntity = !hero.dead && dh < (e.chase?240:110) ? hero : null;
    let minTargDist = targetEntity ? dh : 1e9;
    for(const al of allies){
      if(!al.dead){
        const ax = al.x - e.x, ay = al.y - e.y, da = Math.hypot(ax, ay) || 1;
        if(da < (e.chase ? 200 : 90) && da < minTargDist){
          minTargDist = da;
          targetEntity = al;
        }
      }
    }
    e.chase = !!targetEntity;
    if(targetEntity){
      const tx = targetEntity.x - e.x, ty = targetEntity.y - e.y, dtarg = minTargDist;
      if(dtarg > e.sz/2 + 11){
        e.x += tx/dtarg * e.sp * dt;
        e.y += ty/dtarg * e.sp * dt;
      } else {
        const dmg = e.d * 1.6 * 1.12**S.wave * dt;
        targetEntity.hp -= dmg;
        if(targetEntity.hp <= 0){
          if(targetEntity === hero) heroDie();
          else allyDie(targetEntity);
        }
      }
    }
    else if(d>stop){e.x-=e.x/d*e.sp*dt;e.y-=e.y/d*e.sp*dt}
    else hurtTower(e.d*2.4*1.12**S.wave*(1-val('arm'))*dt);
  }
  for(const b of bl){
    if(!b.tg||b.tg.hp<=0){b.tg=en.slice().sort((a,c)=>Math.hypot(a.x-b.x,a.y-b.y)-Math.hypot(c.x-b.x,c.y-b.y))[0];if(!b.tg){b.dead=1;continue}}
    const dx=b.tg.x-b.x,dy=b.tg.y-b.y,d=Math.hypot(dx,dy)||1;
    if(d<b.tg.sz/2+5){hit(b.tg,b.d,b.crit);b.dead=1}else{b.x+=dx/d*560*dt;b.y+=dy/d*560*dt}
  }
  bl=bl.filter(b=>!b.dead);
  for(const f of fx){f.l-=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt}else f.r+=(f.m-f.r)*dt*12}
  fx=fx.filter(f=>f.l>0);for(const q of tx){q.y-=30*dt;q.l-=dt}tx=tx.filter(q=>q.l>0);
  autoCast();
}

}
function refresh(){
  document.querySelectorAll('.card').forEach(b=>{const u=UM[b.dataset.id],l=S.lv[u.id],maxed=u.max!=null&&l>=u.max,c=maxed?0:u.cost(l),have=u.gem?S.gems:S.coins;
    b.querySelector('.cn').textContent=u.n+' · nv '+l;b.querySelector('.cv').textContent=u.fmt(u.val(l));
    b.querySelector('.cc').textContent=maxed?'MÁX':(u.gem?'💎 ':'🪙 ')+fmt(c);b.disabled=maxed;b.classList.toggle('no',!maxed&&have<c)});
  $('coins').textContent=fmt(S.coins);$('gems').textContent=fmt(S.gems);
}
function buy(id){
  const u=UM[id],l=S.lv[id];if(u.max!=null&&l>=u.max)return;
  const c=u.cost(l),have=u.gem?S.gems:S.coins;if(have<c){beep(140,.08);return}
  const old=maxHp();if(u.gem)S.gems-=c;else S.coins-=c;S.lv[id]++;
  if(id==='hp')tw.hp+=maxHp()-old;if(id==='hhp')hero.hp+=UM.hhp.val(S.lv.hhp)-UM.hhp.val(S.lv.hhp-1);
  if(id.startsWith('h_'))syncAllies();
  beep(740,.07,'triangle',.04,1100);refresh();save();
}
function hudTick(){
  $('wv').textContent='Onda '+S.wave;
  $('wsub').textContent=phase==='fight'?'⚔ '+(en.length+spawnQ)+' · ♥ '+Math.round(tw.hp/maxHp()*100)+'%':'Próxima onda em '+Math.max(0,Math.ceil(breakT))+'s';
  document.querySelectorAll('.pw').forEach((b,i)=>{b.style.setProperty('--p',pcd[i]>0?pcd[i]/PW[i].cd*100:0);b.classList.toggle('on',(i===1&&agil>0)||(i===2&&tw.sh>0)||(i===3&&pets.length>0))});
  const wallCfg = val('hwall');
  const bW = $('bWall');
  if(bW){
    bW.style.opacity = (wallCfg && wallCfg.lv > 0 && !hero.dead) ? '1' : '0.5';
    bW.title = wallCfg && wallCfg.lv > 0 ? `Colocar Muralha nv ${wallCfg.lv} (Ativas: ${walls.length})` : 'Desbloqueie na aba HERÓI';
  }
  refresh();
}
function overlay(html){const o=$('ov');o.innerHTML='<div class="box">'+html+'</div>';o.classList.remove('hide')}
function closeOv(){$('ov').classList.add('hide');paused=false}
function settings(){
  paused=true;
  overlay(`<h2>BLOCO SENTINELA</h2><p>Melhor onda: ${S.best} · Jogo idle: ele continua a defender sozinho, e você ganha moedas mesmo fora da tela.</p>
  <button class="btn main" id="o1">Continuar</button><button class="btn" id="o2">Poderes automáticos: ${S.auto?'LIGADO':'DESLIGADO'}</button><button class="btn" id="o3">Zerar progresso</button>
  <p style="font-size:12px">${coarse?'Herói: arraste o dedo na tela.':'Herói: use as setas ou WASD.'} Atalhos: 1 a 4 usam os poderes · P pausa.</p>`);
  $('o1').onclick=closeOv;$('o2').onclick=()=>{S.auto=!S.auto;save();settings()};
  $('o3').onclick=()=>{if(confirm('Apagar todo o progresso?')){S=S0();try{localStorage.removeItem('bloco_sentinela')}catch(e){}en=[];bl=[];pets=[];pick=[];hero.hp=val('hhp');hero.dead=false;tw.hp=maxHp();tw.sh=0;phase='break';breakT=1;buildCards();closeOv()}};
}
/* ---------- entrada ---------- */
$('bWall').onclick=()=>buildHeroWall();
$('bSet').onclick=settings;
$('bSpd').onclick=()=>{S.speed=S.speed%3+1;$('bSpd').textContent='x'+S.speed;save()};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;buildCards()});
const coarse=typeof matchMedia==='function'&&matchMedia('(pointer:coarse)').matches;
const KM2={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d'};
addEventListener('keydown',e=>{
  const k=KM2[e.key];if(k){keys[k]=1;e.preventDefault();return}
  if(e.key==='e'||e.key==='E'||e.code==='Space'){buildHeroWall();e.preventDefault();return}
  if(e.key>='1'&&e.key<='4')cast(+e.key-1);else if(e.key==='p'||e.key==='P')paused?closeOv():settings()
});
addEventListener('keyup',e=>{const k=KM2[e.key];if(k)keys[k]=0});
addEventListener('blur',()=>{keys={}});
cv.addEventListener('pointerdown',e=>{if(paused||e.pointerType==='mouse')return;joy={id:e.pointerId,sx:e.clientX,sy:e.clientY,dx:0,dy:0};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){
    mouseWorld.x = (e.clientX - cx) / K;
    mouseWorld.y = (e.clientY - cy) / K;
    mouseWorld.on = true;
  }
  if(!joy||e.pointerId!==joy.id)return;
  let dx=(e.clientX-joy.sx)/46,dy=(e.clientY-joy.sy)/46;const m=Math.hypot(dx,dy);
  if(m>1){dx/=m;dy/=m;joy.sx=e.clientX-dx*46;joy.sy=e.clientY-dy*46}if(m<.15){dx=0;dy=0}joy.dx=dx;joy.dy=dy;
});
cv.addEventListener('pointerleave',()=>{mouseWorld.on=false});
cv.addEventListener('click',e=>{
  if(paused || e.pointerType === 'touch') return;
  const cfg = val('hwall');
  if(!cfg || cfg.lv <= 0) return;
  // Converte a posição do clique do mouse para as coordenadas do mundo de jogo
  const mx = (e.clientX - cx) / K;
  const my = (e.clientY - cy) / K;
  // Só coloca a muralha se não clicou na interface inferior ou nos botões do HUD
  const topPanel = $('panel').getBoundingClientRect().top;
  if(e.clientY < topPanel - 10 && e.clientY > 60){
    buildHeroWall(mx, my);
  }
});
['pointerup','pointercancel'].forEach(v=>cv.addEventListener(v,e=>{if(joy&&e.pointerId===joy.id)joy=null}));
addEventListener('resize',layout);addEventListener('load',layout);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
setInterval(save,5000);
/* ---------- laço ---------- */
let last=0,hudT=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(!paused)for(let i=0;i<S.speed;i++)update(dt);
  draw();hudT-=dt;if(hudT<=0){hudT=.15;hudTick()}
  requestAnimationFrame(loop);
}
/* ---------- início ---------- */
buildPowers();buildCards();$('bSpd').textContent='x'+S.speed;layout();tw.hp=maxHp();hero.hp=val('hhp');setTimeout(()=>note(coarse?'Arraste o dedo na tela para mover o herói':'Use as setas (ou WASD) para mover o herói'),600);
const away=Math.min((Date.now()-(S.last||Date.now()))/1000,8*3600);
if(away>60&&S.wave>1){const gain=Math.floor(away*.3*S.wave*val('gold'));S.coins+=gain;save();paused=true;
  overlay(`<h2>BEM-VINDO DE VOLTA</h2><p>Sua torre defendeu por ${Math.floor(away/60)} min e rendeu <b>🪙 ${fmt(gain)}</b>.</p><button class="btn main" id="o1">Coletar</button>`);$('o1').onclick=()=>{closeOv();refresh()}}
requestAnimationFrame(loop);
</script>
</body>
</html>
